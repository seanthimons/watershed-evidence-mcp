[project]
name = "watershed-evidence-mcp"
version = "0.1.0"
description = "Provenance-first MCP access to public U.S. water-quality evidence."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sean Thimons" }]
dependencies = [
  "mcp>=1.23,<2",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "duckdb>=1.5.6",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
watershed-evidence-mcp = "watershed_evidence_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
